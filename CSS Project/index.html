<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOOD COURT</title>
    <link rel="stylesheet" href="./styl.css">
    <link rel="icon" type="image.png" href="./assets/food icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>
<body>
    <!-- here is my navbar started -->
    <header>
        <nav class="navbar">
         <i class="fa-solid fa-bars" icon></i>
         <h4 class="heading"> FOOD COURT </h4>
         <ul class="Menus">
        <li>SHOP</li>
        <li>FEATURE</li>
        <li>RECIPIES</li>
        <li>HOTLINE</li>
         </ul>
         <div class="profile-section">
            <i class="fa-solid fa-cart-shopping"icon2></i>
            <div class="profile-div">
                <img class="profile-img" src="./assets/profile image.png" alt="profile">
            </div>
         </div>
        
        </nav>
    </header>
    <!-- this is my main section -->
    <main>
        <!-- this is my hero section -->
        <section class="hero-section">
            <!-- hero left -->
        <div class="hero-left">
            <h3 class="left-heading">
                Herb-Infused<span class="cb">Chicken<br> Delight
                </span> 
            </h3>
            <p class="left-para">
                Herb-Infused Chicken Delight features
                tender grilled chicken drumsticks seasoned
                with fresh rosemary, served atop a
                vibrant mix of cherry tomatoes, cucumber
                slices, and greens for a flavorful and healthy
                meal.
            </p>
            <!-- buttons -->
            <div class="btn-div">
                <button class="order-btn">
                    Order Now
                </button>
                <button class="dine-btn">
                    Dine-In
                </button>
            </div>
            <div class="image-div">
               <img src="./assets/menu1.1.png" alt="menu1">
               <img src="./assets/menu2.1.png" alt="menu2">
               <img src="./assets/menu3.1.png" alt="menu3">
            </div>
        </div>
          <!-- hero right -->
          <div class="hero-right">
             <img class="bg-image" src="./assets/img1.11.png" alt="image1">
            <img class="front-image" src="./assets/image2.png" alt="image2"> 
          </div>
        </section>
    </main>
</body>
</html>
